<!DOCTYPE html>
<html>
<html lang="zh-CN">
<head>
    <title>DeepSeek 极简测试</title>
</head>
<body>
    <input type="text" id="input" placeholder="输入问题">
    <button onclick="callDeepSeek()">提问</button>
    <div id="output"></div>

    <script>
        async function callDeepSeek() {
            const API_KEY = "sk-your-api-key"; // 此处暴露密钥，极度危险！
            const inputText = document.getElementById('input').value;
            
            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [{ role: "user", content: inputText }]
                    })
                });
                
                const data = await response.json();
                document.getElementById('output').innerHTML = data.choices[0].message.content;
            } catch (error) {
                console.error('错误:', error);
            }
        }
    </script>
</body>
</html>
