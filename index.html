<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="张俊杰的星空漫游博客">
    <meta name="keywords" content="博客, 张俊杰, 天文, 星空摄影">
    <title>星空漫游 | 张俊杰的博客</title>
    <style>
        :root {
            --primary: #3B82F6;
            --gradient: linear-gradient(135deg, #3B82F6 0%, #6366F1 100%);
        }

        body {
            font-family: "微软雅黑", "MiSans", system-ui, sans-serif;
            line-height: 1.8;
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 30px;
            position: relative;
        }

        nav {
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.9);
            padding: 1rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            position: sticky;
            top: 20px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
        }

        nav a {
            margin-right: 2rem;
            color: #475569 !important;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        .main-content {
            width: 780px;
            margin-left: 360px;
            animation: fadeIn 0.8s ease;
        }

        h1 {
            font-size: 2.5rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 2rem 0;
            position: relative;
            padding-left: 1rem;
        }

        h1::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--gradient);
            border-radius: 4px;
        }

        .star-decor {
            position: fixed;
            right: 50px;
            top: 100px;
            font-size: 2rem;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
            animation: twinkle 2s infinite, float 6s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @media (max-width: 1024px) {
            body {
                flex-direction: column;
                padding: 20px;
            }
            .main-content {
                width: 100%;
                margin-left: 0;
            }
        }

        @media (max-width: 768px) {
            nav .download-btn {
                margin: 10px 0 !important;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

    <!-- 引入 Supabase 客户端库 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ==================== Supabase 初始化 ====================
        const SUPABASE_URL = "https://pgqyscacxrlxvhujjiht.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBncXlzY2FjeHJseHZodWpqaWh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYxMDM0NzMsImV4cCI6MjA2MTY3OTQ3M30.xkcQ_481Xtk897aDSSsTv8NfNQrPtDs2gsesZUOMKOs";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
        // ==================== 注册功能 ====================
        document.getElementById('supabaseRegisterBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = prompt('请输入邮箱:');
            const password = prompt('请输入密码（至少6位）:');

            // 输入验证
            if (!email || !password || password.length < 6) {
                alert('邮箱或密码不符合要求！');
                return;
            }

            try {
                // 调用 Supabase 注册接口
                const { data, error } = await supabase.auth.signUp({ 
                    email: email,
                    password: password
                });

                if (error) throw error;
                alert('注册成功！请检查邮箱验证链接✨');

                // 可选：保存用户信息到数据库
                const { error: dbError } = await supabase
                    .from('profiles')
                    .insert([{ 
                        id: data.user.id, 
                        email: data.user.email,
                        created_at: new Date()
                    }]);
                if (dbError) console.error('保存用户信息失败:', dbError);

            } catch (error) {
                alert(`注册失败: ${error.message}`);
            }
        });

        // ==================== 登录功能 ====================
        document.getElementById('supabaseLoginBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = prompt('请输入邮箱:');
            const password = prompt('请输入密码:');

            try {
                // 调用 Supabase 登录接口
                const { data, error } = await supabase.auth.signInWithPassword({ 
                    email: email,
                    password: password
                });

                if (error) throw error;
                alert(`欢迎回来，${data.user.email}！`);
                document.getElementById('userEmail').textContent = data.user.email;

            } catch (error) {
                alert(`登录失败: ${error.message}`);
            }
        });

        // ==================== 实时监听用户状态 ====================
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN') {
                console.log('用户已登录:', session.user);
                document.getElementById('userEmail').textContent = session.user.email;
            } else if (event === 'SIGNED_OUT') {
                console.log('用户已退出');
                document.getElementById('userEmail').textContent = '';
            }
        });
    </script>
