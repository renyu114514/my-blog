    <style>
        /* 全局样式 */
        :root {
            --primary: #3B82F6;
            --gradient: linear-gradient(135deg, #3B82F6 0%, #6366F1 100%);
        }

        body {
            font-family: "微软雅黑", "MiSans", system-ui, sans-serif;
            line-height: 1.8;
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 30px;
            position: relative;
        }

        /* 导航栏美化 */
        nav {
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.9);
            padding: 1rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            position: sticky;
            top: 20px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
        }

        nav a {
            margin-right: 2rem;
            color: #475569 !important;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* 主内容区优化 */
        .main-content {
            width: 780px;
            animation: fadeIn 0.8s ease;
        }

        h1 {
            font-size: 2.5rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 2rem 0;
            position: relative;
            padding-left: 1rem;
        }

        h1::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--gradient);
            border-radius: 4px;
        }

        /* 文章卡片升级 */
        .article-list {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            padding: 2rem;
            margin: 2rem 0;
        }

        .post {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .post:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        .post h3 {
            font-size: 1.25rem;
            margin: 0 0 0.5rem;
            color: #1e293b;
        }

        /* 功能按钮美化 */
        .download-btn {
            display: inline-flex;
            align-items: center;
            padding: 0.8rem 1.5rem;
            background: var(--gradient);
            color: white !important;
            border-radius: 8px;
            font-weight: 500;
            transition: transform 0.2s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59,130,246,0.3);
        }

        /* 星空特效增强 */
        .star-decor {
            position: fixed;
            right: 50px;
            top: 100px;
            font-size: 2rem;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
            animation: twinkle 2s infinite, float 6s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* 歌词容器优化 */
        .lyrics-box {
            background: rgba(241,245,249,0.6);
            backdrop-filter: blur(6px);
        }

        /* 响应式优化 */
        @media (max-width: 1024px) {
            body {
                flex-direction: column;
                padding: 20px;
            }
            .music-sidebar {
                position: static;
                width: 100%;
                margin-top: 2rem;
            }
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }

        .modal-content {
            background: white;
            margin: 15% auto;
            padding: 20px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .modal-content input {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .modal-content button {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* 新增音乐播放器样式 */

/* 调整主内容区间距 */
.main-content {
    width: 780px;

}

        margin-left: 0;

}
